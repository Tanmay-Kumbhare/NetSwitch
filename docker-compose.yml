# NetSwitch Optional Docker MySQL Setup
# Use this only if you do not have a native MySQL service running.
# To start:  docker compose up -d
# To stop:   docker compose down

services:
  mysql:
    image: mysql:8.0
    container_name: netswitch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: netswitch
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

